name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests
        run: yarn test

      - name: Native recording failure policies
        run: yarn test:native:failure

      - name: Build library
        run: yarn prepare

      - name: Expo SDK 57 prebuild smoke test
        run: yarn test:expo:plugin

      - name: Android Codegen
        run: >-
          node node_modules/react-native/scripts/generate-codegen-artifacts.js
          -p example -t android -o /tmp/nosmai-codegen-android

      - name: iOS Codegen
        run: >-
          node node_modules/react-native/scripts/generate-codegen-artifacts.js
          -p example -t ios -o /tmp/nosmai-codegen-ios

      - name: Audit npm tarball
        run: yarn package:check

  native-recording-failures-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Native recording failure policies
        run: bash scripts/test-native-recording-failures.sh
