buildscript {
  ext.ReactNativeCameraSdk = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ReactNativeCameraSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

android {
  namespace = "com.nosmai.camerasdk.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    consumerProguardFiles "consumer-rules.pro"

    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"

  // The consuming app owns the proprietary SDK binary. Keeping this optional
  // lets JavaScript/Codegen CI run without redistributing the AAR.
  def nosmaiAar = file("${rootProject.projectDir}/app/libs/nosmai-release.aar")
  if (nosmaiAar.exists()) {
    compileOnly files(nosmaiAar)
  }
}
